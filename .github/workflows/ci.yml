# Runs the checks on every pull request and on pushes to main:
# lint, build and Vitest, and the pgTAP tests against Supabase Local.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  db:
    runs-on: ubuntu-latest
    env:
      # config.toml reads the Google OAuth settings; the tests do not sign in,
      # so placeholders are enough. No real secrets are used here.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Outgoing connections (such as image pulls) take ports from 32768-60999,
      # which includes Supabase Local's 54321-54324, so the database container
      # can fail with "address already in use". Keep them out of that range.
      - run: sudo sysctl -w net.ipv4.ip_local_port_range="60100 65000"
      # Applies the migrations and supabase/seed.sql. Only the services the
      # database tests need are started.
      - run: npx supabase start -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npx supabase test db
