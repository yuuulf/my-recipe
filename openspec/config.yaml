schema: spec-driven

context: |
  自分と家族・友人だけで使うレシピ帳アプリ。日常で使うものなので、
  「簡単に登録・すぐ検索・スマホで見やすい・機能を増やしすぎない」を優先する。

  動作モードは3つあり、変更はすべてのモードで矛盾なく動くようにする:
    - Supabase接続モード: Auth / PostgreSQL / RLS / RPC を使う
    - ローカルプレビューモード: 環境変数がないときに使う。データはlocalStorageに保存
    - デモモード: 固定データで読み取り専用。保存・削除・招待はできない
  データはグループ単位で共有する。アクセス制御はRLSとRPCで守り、フロントエンドのチェックだけに頼らない。
  service-roleキーなどの秘密情報は VITE_* 変数に入れない。
  スキーマを変えるときは supabase/migrations/ にタイムスタンプ付きの新しいSQLを追加する。既存のマイグレーションは書き換えない。
  自動テストはまだない。検証は `npm run lint`、`npm run build`、手動確認で行う。
  成果物（proposal / design / specs / tasks）は日本語で書く。

rules:
  proposal:
    - 変更の目的、利用者に見える効果、対象範囲と対象外を明記する
    - 影響する動作モード（Supabase / ローカルプレビュー / デモ）を明記する
    - UIだけの変更か、データ・API・ルーティングの変更を含むかを最初に区別する
  design:
    - スキーマ変更がある場合は、マイグレーションの内容とRLSへの影響を書く
    - ローカルプレビュー（localStorage）側のデータ形式もあわせて扱う
    - スマートフォン表示を基準に設計し、PC表示は補足として書く
    - スタイルは Tailwind CSS（v4）のユーティリティクラスで書く。色・文字サイズ・ブレークポイントは src/index.css の @theme のトークンを使い、新しい値が必要なときはトークンの追加として書く
    - 任意の色（[#...]）、@apply、CSSファイルの追加は使わない。繰り返すクラスは src/components/styles.ts などの共通部品にまとめる
  specs:
    - 認証が必要な画面とグループ所属が必要な画面を区別してシナリオを書く
    - デモモードで無効になる操作がある場合は、そのシナリオも書く
  tasks:
    - 最後に `npm run lint` と `npm run build` のタスクを入れる
    - 影響するモードごとに手動確認のタスクを入れる
    - スキーマ変更がある場合は、マイグレーション追加のタスクを独立させる

operations:
  apply:
    guidance:
      - コードスタイルは AGENTS.md に従う（セミコロンなし、シングルクォート、import type など）
      - タスクにない機能を追加しない
      - 実施した検証と未実施の検証を区別して報告する
  archive:
    guidance:
      - コミットメッセージは短い日本語で書く（例「デモモードを追加」）
      - 仕様と実装の整合、タスクの完了状況、検証結果を確認する
      - 未完了事項や適用が必要な migration があれば明示する
